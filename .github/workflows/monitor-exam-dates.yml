name: Update ApexEdu Exam Dates

on:
  schedule:
    # GitHub may delay scheduled runs, especially during periods of high load.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apexedu-exam-date-update
  cancel-in-progress: false

jobs:
  update-exam-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate existing exam feed
        run: python -m json.tool exams-feed.json > /dev/null

      - name: Check official exam portals
        run: python scripts/update_exam_dates.py

      - name: Upload source-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apexedu-source-monitor-report
          path: monitor-output/source-monitor-report.json
          if-no-files-found: warn
          retention-days: 30
